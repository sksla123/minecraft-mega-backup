# Cargo.toml
[package]
name = "mcmgb"
version = "0.1.0"
edition = "2021"
description = "Minecraft-mega backup daemon"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
shoutrrr = "0.1.0"
anyhow = "1.0"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.4"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }
rcon = "0.5"
